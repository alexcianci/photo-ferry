<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>iPhone Photo Drop</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px;
         max-width: 560px; margin-inline: auto; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #8884; border-radius: 12px; padding: 16px; margin-block: 16px; }
  input[type=tel] { font-size: 28px; letter-spacing: 8px; width: 100%; text-align: center;
                    padding: 12px; box-sizing: border-box; }
  button { font-size: 17px; padding: 14px 18px; width: 100%; border-radius: 10px;
           border: 0; background: #0a84ff; color: #fff; margin-top: 12px; }
  button:disabled { opacity: .5; }
  #files { display: none; }
  ul { padding-left: 18px; }
  .err { color: #d00; }
  .ok { color: #2a2; }
</style>
</head>
<body>
  <h1>Send photos to your PC</h1>

  <div class="card" id="pin-card">
    <p>Enter the 6-digit PIN shown on your PC.</p>
    <input id="pin" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
           placeholder="000000" />
    <button id="unlock">Unlock</button>
    <p id="pin-msg" class="err"></p>
  </div>

  <div class="card" id="upload-card" hidden>
    <input id="files" type="file" accept="image/*,video/*" multiple />
    <button id="pick">Choose photos &amp; videos</button>
    <button id="send" disabled>Upload</button>
    <p id="up-msg"></p>
    <ul id="done"></ul>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let chosen = [];

$("unlock").onclick = async () => {
  const pin = $("pin").value.trim();
  $("pin-msg").textContent = "";
  const r = await fetch("/auth", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin }),
  });
  if (r.ok) {
    $("pin-card").hidden = true;
    $("upload-card").hidden = false;
  } else if (r.status === 423) {
    $("pin-msg").textContent = "Too many wrong attempts. The receiver has shut down.";
  } else if (r.status === 403) {
    $("pin-msg").textContent = "Session expired. Rescan the QR code on your PC.";
  } else {
    $("pin-msg").textContent = "Wrong PIN. Try again.";
  }
};

$("pick").onclick = () => $("files").click();
$("files").onchange = () => {
  chosen = Array.from($("files").files);
  $("up-msg").textContent = chosen.length + " selected";
  $("send").disabled = chosen.length === 0;
};

$("send").onclick = async () => {
  $("send").disabled = true;
  for (const file of chosen) {
    $("up-msg").textContent = "Uploading " + file.name + " ...";
    try {
      const r = await fetch("/upload", {
        method: "POST",
        headers: { "X-Filename": encodeURIComponent(file.name),
                   "Content-Type": file.type || "application/octet-stream" },
        body: file,
      });
      const li = document.createElement("li");
      if (r.ok) { li.className = "ok"; li.textContent = "Saved " + file.name; }
      else { const t = await r.text(); li.className = "err";
             li.textContent = "Rejected " + file.name + " (" + t + ")"; }
      $("done").appendChild(li);
    } catch (e) {
      const li = document.createElement("li");
      li.className = "err"; li.textContent = "Failed " + file.name;
      $("done").appendChild(li);
    }
  }
  $("up-msg").textContent = "Done.";
  $("send").disabled = false;
};
</script>
</body>
</html>
