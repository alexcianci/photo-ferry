[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-ferry"
version = "0.2.0"
description = "Local on-demand HTTPS service for moving photos and videos between an iPhone and a Windows PC."
requires-python = ">=3.12"
dependencies = ["segno==1.6.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photo_ferry = ["static/*.html", "static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
